<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>iMybook - READLIST</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
    <div class="app">
        <div class="screen">

            <!--navigation: brand logo + pill toggle -->
            <nav>
                <a href="index.html" class="brand">
                    <span class="brand-icon">📖</span>
                    <span class="brand-name">i<b>My</b>book</span>
                </a>
                <div class="pills">
                    <a href="index.html">Discover</a>
                    <a href="reading-list.html" class="active">READLIST</a>
                </div>
            </nav>

            <p class="eyebrow">Your books</p>
            <h1>Your<br>READLIST</h1>

            <!--summary calculated from the saved list -->
            <div id="summary"></div>

            <!--form used for adding and editing a book -->
            <div class="form-box" style="margin-top: 24px;">
                <h2 id="formTitle">Add a Book</h2>

                <label for="titleInput">Title</label>
                <input type="text" id="titleInput" placeholder="Book title">

                <label for="authorInput">Author</label>
                <input type="text" id="authorInput" placeholder="Author name">

                <label for="pagesInput">Total pages</label>
                <input type="number" id="pagesInput" min="1" placeholder="e.g. 320">

                <label for="readInput">Pages read</label>
                <input type="number" id="readInput" min="0" value="0">

                <label for="statusInput">Status</label>
                <select id="statusInput">
                    <option value="To Read">To Read</option>
                    <option value="Reading">Reading</option>
                    <option value="Finished">Finished</option>
                </select>

                <label for="notesInput">Notes</label>
                <input type="text" id="notesInput" placeholder="Optional notes">

                <button type="button" id="saveBtn">Add Book</button>
                <button type="button" id="cancelBtn" class="hidden">Cancel Edit</button>
            </div>

            <!--feedback messages for add / update / delete / errors -->
            <p id="formMessage"></p>

            <!--saved books (the id must be exactly "bookList") -->
            <div id="bookList"></div>

            <!--latest suggestions from the 'Discover page' -->
            <h2 style="margin-top: 34px;">Latest Suggestions</h2>
            <div id="savedSuggestions"></div>

        </div>
    </div>

    <script src="localstorage.js"></script>
    <script src="reading-list.js"></script>
    <script src="petals.js"></script>
    </body>
</html>
